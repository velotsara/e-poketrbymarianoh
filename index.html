async function refreshToken(){
  if(!SESS||!SESS.refresh) throw new ApiError('Session expirée. Reconnectez-vous.','auth',401);
  const j=await raw(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESS.refresh})});
  setSessFrom(j)}
async function sb(path,o){o=o||{};
  if(SESS&&SESS.exp-Date.now()<60000){try{await refreshToken()}catch(e){if(e.code==='net')throw e;await doLogout(true);throw e}}
  const go=()=>{const h={apikey:SB_KEY,'Content-Type':'application/json'};if(SESS)h.Authorization='Bearer '+SESS.access;
    return raw(SB_URL+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined})};
  try{return await go()}catch(e){if(e.status===401&&SESS){try{await refreshToken()}catch(e2){await doLogout(true);throw e2}return await go()}throw e}}
const rpc=(n,a)=>sb('/rest/v1/rpc/'+n,{method:'POST',body:a||{}});
const sel=p=>sb('/rest/v1/'+p);

function friendlyErr(e){
  const m=String((e&&e.message)||e);
  if(e&&e.code==='net') return m;
  const map=[[/invalid login credentials|invalid_credentials/i,'Numéro ou PIN incorrect.'],
   [/already registered|user_already_exists|already been registered/i,'Un compte existe déjà avec ce numéro.'],
   [/rate limit|over_.*rate|too many/i,'Trop de tentatives. Réessayez dans quelques minutes.'],
   [/database error saving new user/i,'Inscription impossible : vérifiez le nom et le numéro (03XXXXXXXX).'],
   [/jwt expired|invalid jwt/i,'Session expirée. Reconnectez-vous.'],
   [/password should be at least|weak_password/i,'Le PIN doit comporter 6 chiffres.']];
  for(const [r,t] of map) if(r.test(m)||(e&&r.test(String(e.code)))) return t;
  return m}

async function signup(name,phone,pin,ref){
  if(name.length<2) throw new ApiError('Saisissez votre nom.');
  if(!/^03\d{8}$/.test(phone)) throw new ApiError('Numéro invalide : 10 chiffres commençant par 03 (ex. 0341234567).');
  if(!/^\d{6}$/.test(pin)) throw new ApiError('Le code PIN doit comporter 6 chiffres.');
  const j=await raw(SB_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:emailOf(phone),password:pin,data:{name,phone,ref:ref||''}})});
  if(!j||!j.access_token) throw new ApiError("Compte créé, mais la confirmation par e-mail est encore activée. Désactivez « Confirm email » dans Supabase.",'confirm',0);
  setSessFrom(j)}
async function login(phone,pin){
  if(!/^03\d{8}$/.test(phone)) throw new ApiError('Numéro invalide : 10 chiffres commençant par 03.');
  if(!/^\d{6}$/.test(pin)) throw new ApiError('Le code PIN doit comporter 6 chiffres.');
  const j=await raw(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:emailOf(phone),password:pin})});
  setSessFrom(j)}
async function doLogout(silent){
  try{if(SESS&&!silent)await raw(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SESS.access}})}catch(e){}
  S.admCnt=null;document.title="E-POKETR'BY";saveSess(null);S={me:null,bal:{},ledger:[],assets:S.assets,fee:S.fee,pdep:[],pwd:[],swaps:[],cg:S.cg,usdMga:S.usdMga,loaded:false,pay:S.pay,claims:[],ann:[],rates:S.rates,ratesOk:S.ratesOk,set:{},gm:S.gm};
  ui.tab='home';ui.openAsset=null;closeSheet();render()}

async function refresh(){
  if(!SESS) return;
  const uid=SESS.uid,opt=p=>sel(p).catch(()=>null);   // les tables des parties 7 sont facultatives tant que le SQL n'est pas installé
  const [me,bals,led,ass,set,dep,wd,sw,pn,cl,an,rt,nr]=await Promise.all([
    sel('profiles?select=id,name,phone,kyc_level,role,referral_code,memo_id&id=eq.'+uid),
    sel('balances?select=asset,amount&user_id=eq.'+uid),
    sel('ledger?select=id,asset,amount,type,note,created_at&user_id=eq.'+uid+'&order=id.desc&limit=200'),
    sel('assets?select=code,price_mga,price_updated_at,enabled,buy_margin,sell_margin,manual_buy_mga,manual_sell_mga,manual_updated_at').catch(()=>sel('assets?select=code,price_mga,price_updated_at,enabled')),
    sel('settings?select=key,value'),
    sel('mga_deposits?select=id,operator,sender_number,amount,reference,status,created_at,decided_at&user_id=eq.'+uid+'&order=created_at.desc&limit=100'),
    sel('withdrawals?select=id,asset,network,address,memo,operator,mobile_number,holder_name,amount,fee,status,txid,reject_reason,dest_type,dest_name,created_at,decided_at&user_id=eq.'+uid+'&order=created_at.desc&limit=100').catch(()=>sel('withdrawals?select=id,asset,network,address,memo,operator,mobile_number,holder_name,amount,fee,status,txid,reject_reason,created_at,decided_at&user_id=eq.'+uid+'&order=created_at.desc&limit=100')),
    sel('swaps?select=from_asset,to_asset,from_amount,to_amount,price_mga,fee_rate,created_at&user_id=eq.'+uid+'&order=created_at.desc&limit=200'),
    opt('pay_numbers?select=operator,number,holder_name'),
    opt('crypto_deposit_claims?select=id,asset,network,txid,from_address,amount,status,created_at,decided_at&user_id=eq.'+uid+'&order=created_at.desc&limit=100'),
    opt('announcements?select=id,title,body,level,expires_at&active=eq.true&order=created_at.desc&limit=10'),
    rpc('get_rates').catch(()=>null),
    opt('asset_networks?select=asset,network,label,fee,min_withdraw,address_regex,needs_memo,memo_regex,enabled')]);
  S.me=(me&&me[0])||null;
  if(!S.me) throw new ApiError("Profil introuvable. Le profil n'a pas été créé (vérifiez que les 6 parties SQL ont bien été exécutées).");
  applyNetworks(nr);
  S.bal={};(bals||[]).forEach(b=>S.bal[b.asset]=Number(b.amount));
  S.ledger=led||[];
  const nz=v=>v==null?null:Number(v);
  S.assets={};(ass||[]).forEach(a=>S.assets[a.code]={price:a.price_mga==null?0:Number(a.price_mga),updated:a.price_updated_at,enabled:a.enabled,bm:nz(a.buy_margin),sm:nz(a.sell_margin),mb:nz(a.manual_buy_mga),ms:nz(a.manual_sell_mga),mu:a.manual_updated_at||null});
  S.set={};(set||[]).forEach(x=>S.set[x.key]=x.value);
  S.fee=Number(S.set.swap_fee||0.01);
  S.gm={buy:S.set.buy_margin!=null?Number(S.set.buy_margin):S.fee,sell:S.set.sell_margin!=null?Number(S.set.sell_margin):S.fee};
  S.ratesOk=Array.isArray(rt);S.rates={};(rt||[]).forEach(r=>S.rates[r.code]={buy:r.buy==null?0:Number(r.buy),sell:r.sell==null?0:Number(r.sell),ref:r.reference==null?0:Number(r.reference),updated:r.updated});
  S.pdep=dep||[];S.pwd=wd||[];S.swaps=sw||[];
  S.pay={};(pn||[]).forEach(x=>S.pay[x.operator]={number:x.number,holder:x.holder_name});
  S.claims=cl||[];
  const now=Date.now();S.ann=(an||[]).filter(x=>!x.expires_at||new Date(x.expires_at).getTime()>now);
  S.loaded=true}

async function loadMarket(){ /* tendances d'affichage (CoinGecko) – ne sert PAS à fixer les prix */
  try{
    const ids=CR.map(a=>ASSETS[a].cg).join(',');
    const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+ids+'&sparkline=true&price_change_percentage=24h');
    if(!r.ok) return;const arr=await r.json();if(!Array.isArray(arr)) return;
    arr.forEach(c=>{const k=CR.find(x=>ASSETS[x].cg===c.id);if(!k)return;
      const sp=(c.sparkline_in_7d&&c.sparkline_in_7d.price)||[],step=Math.max(1,Math.floor(sp.length/48));
      S.cg[k]={ch:typeof c.price_change_percentage_24h==='number'?c.price_change_percentage_24h:null,spark:sp.filter((_,i)=>i%step===0).slice(-48),img:c.image||'',usd:c.current_price}});
    if(S.me&&!busy()&&(ui.tab==='quotes')) render(true)
  }catch(e){}}

function spark(h){if(!h||h.length<3)return '';const mn=Math.min(...h),mx=Math.max(...h),r=(mx-mn)||1;
  const pts=h.map((v,i)=>(i/(h.length-1)*118+1).toFixed(1)+','+(34-(v-mn)/r*30).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 120 36" preserveAspectRatio="none" class="mini" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${h[h.length-1]>=h[0]?'--up':'--down'})" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}

/* Le grand livre est en lecture seule : la ligne « Retrait … (en cours) » ne peut pas changer.
   Le VRAI statut d'un retrait est dans la table des retraits : on l'affiche à la place. */
function histItems(asset){const it=[];
  S.ledger.forEach((l,i)=>{if(/\(en cours\)$/.test(l.type)||l.type==='Retrait annulé')return;if(!asset||l.asset===asset)it.push({k:'l',l,i,t:l.created_at})});
  S.pwd.forEach(w=>{if(!asset||w.asset===asset)it.push({k:'w',w,t:w.created_at})});
  S.pdep.forEach(d=>{if(d.status!=='confirmed'&&(!asset||asset==='MGA'))it.push({k:'d',d,t:d.created_at})});
  S.claims.forEach(c=>{if(c.status!=='credited'&&(!asset||c.asset===asset))it.push({k:'c',c,t:c.created_at})});
  return it.sort((x,y)=>new Date(y.t)-new Date(x.t))}
function histRows(items,showAsset){return items.map(it=>{
  if(it.k==='l'){const l=it.l,amt=Number(l.amount);
    return `<div class="row clk" data-act="sheetTx" data-i="${it.i}"><div><b>${esc(l.type)}</b><div class="muted">${esc(fdate(l.created_at))}${showAsset?' · '+l.asset:''}</div></div><div class="num ${amt>=0?'pos':'neg'}"><b>${amt>=0?'+':''}${fmt(l.asset,amt)}</b></div></div>`}
  if(it.k==='w'){const w=it.w,neg=w.status!=='rejected';
    return `<div class="row clk" data-act="sheetWd" data-id="${w.id}"><div><b>Retrait ${w.asset}</b> ${stBadge(w.status)}<div class="muted">${esc(fdate(w.created_at))}${showAsset?' · '+w.asset:''}</div></div><div class="num ${neg?'neg':'muted'}"><b>${neg?'−':''}${fmt(w.asset,Number(w.amount))}</b></div></div>`}
  if(it.k==='d'){const d=it.d;
    return `<div class="row clk" data-act="sheetDepReq" data-id="${d.id}"><div><b>Dépôt MGA</b> ${stBadge(d.status)}<div class="muted">${esc(fdate(d.created_at))} · ${esc(d.operator)}</div></div><div class="num ${d.status==='rejected'?'muted':'pos'}"><b>${d.status==='rejected'?'':'+'}${fmt('MGA',Number(d.amount))}</b></div></div>`}
  const c=it.c;
  return `<div class="row clk" data-act="sheetClaim" data-id="${c.id}"><div><b>Dépôt ${c.asset}</b> ${stBadge(c.status)}<div class="muted">${esc(fdate(c.created_at))}${showAsset?' · '+c.asset:''}</div></div><div class="num ${c.status==='rejected'?'muted':'pos'}"><b>${c.status==='rejected'?'':'+'}${fmt(c.asset,Number(c.amount))}</b></div></div>`}).join('')}

function render(keep){const app=$('#app');const y=window.scrollY;
  if(!SESS){app.innerHTML=authView();return}
  if(!S.me||!S.loaded){app.innerHTML=headerBar(false)+'<main><div class="card muted" style="margin-top:20px">Chargement…</div></main>';return}
  const V={home:homeView,quotes:quotesView,swap:swapView,stats:statsView,account:accountView,wallet:walletView,admin:admView};
  if(ui.tab==='admin'&&!isAdmin()) ui.tab='home';
  app.innerHTML=headerBar(true)+'<main>'+V[ui.tab]()+'</main>'+nav();

  const head=`<div class="who">${logo(a,46,net)}<h3 style="margin:0">Recevoir des ${a}</h3></div>${netSel(a,net,'openCryIn')}`;
  openSheet(head+'<div class="note" style="margin-top:12px">Chargement de votre adresse…</div>');
  let info=null,err='';
  try{const r=await rpc('get_deposit_info',{p_asset:a,p_network:net});info=Array.isArray(r)?r[0]:null}catch(e){err=friendlyErr(e)}

  let body;

    const personal=info.shared===false;
    body=`<div class="muted" style="margin-top:10px">${personal?'Votre adresse personnelle':'Adresse de dépôt'} ${a} (${N.label}) :</div><div class="addr">${esc(info.address)}</div>

      <div class="warn"><b>Copiez l'adresse ET le ${N.memo}.</b> L'adresse est commune à tous les clients : sans votre ${N.memo}, les fonds ne peuvent pas être attribués à votre compte.</div>`
        :(personal?'':'<div class="warn"><b>Adresse commune de la plateforme.</b> Déclarez bien votre dépôt ci-dessous pour que l\'équipe puisse l\'identifier.</div>')}
      <div class="warn">Envoyez uniquement du <b>${a}</b> via le réseau <b>${N.label}</b>. Un mauvais réseau ou une mauvaise crypto peut entraîner la perte des fonds.</div>
      <div class="card" style="margin-top:12px"><b>Déclarer mon dépôt</b><div class="note">Après l'envoi, indiquez les détails pour que l'équipe vérifie et crédite votre solde.</div>

       <button class="p full" style="margin-top:12px" data-act="doClaim" data-a="${a}">Déclarer mon dépôt</button></div>`}
  else body=`<div class="warn">${err?esc(err):'Aucune adresse de dépôt n\'est disponible pour le moment pour '+a+' ('+N.label+').'} Contactez le support : une adresse vous sera attribuée.</div>

/* synchronisation des prix par l'admin (CoinGecko × taux USD→MGA) */
async function syncPrices(){
  const ids=CR.map(a=>ASSETS[a].cg).join(',');
  const r1=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd').catch(()=>null);
  if(!r1||!r1.ok) throw new ApiError('Prix CoinGecko indisponibles pour le moment.');
  const px_=await r1.json();let fx=num(LS.get('epoketrby_usdmga')||'');
  if(!fx){const r2=await fetch('https://open.er-api.com/v6/latest/USD').catch(()=>null);if(r2&&r2.ok){const j=await r2.json();fx=j&&j.rates&&j.rates.MGA}}
  if(!fx||fx<=0) throw new ApiError('Taux USD→MGA indisponible : saisissez-le manuellement.');
  S.usdMga=fx;let n=0;
  for(const a of CR){const usd=px_[ASSETS[a].cg]&&px_[ASSETS[a].cg].usd;if(!usd)continue;
    await rpc('admin_set_price',{p_asset:a,p_price_mga:Math.max(1,Math.round(usd*fx))});n++}
  if(!n) throw new ApiError('Aucun prix reçu.');return n}
async function autoSync(){
  if(!S.me||!isAdmin()||LS.get('epoketrby_autosync')==='0'||ui.lock) return;
  try{await syncPrices();await refresh();if(!busy()&&(ui.tab==='admin'||ui.tab==='quotes'))render(true)}catch(e){}}

function setSwap(){const s=ui.swap;let f=val('sw_from'),t=val('sw_to');
  if(f!==s.from){ if(f==='MGA'){ if(t==='MGA') t='USDT' } else t='MGA' }
  else { if(t!=='MGA') f='MGA'; else if(f==='MGA') f='USDT' }
  s.from=f;s.to=t;s.amt='';render(true)}
function calcSwap(fromRender){const s=ui.swap;if(!fromRender){s.amt=val('sw_amt')}
  const a=num(s.amt),o=(a>0&&priceOk(swapCrypto(s.from,s.to)))?swapOut(s.from,s.to,a):0;
  const out=$('#sw_out');if(out)out.textContent=fmt(s.to,o);
  const r=$('#sw_rate');if(r)r.textContent=swapRate(s.from,s.to)}

function beep(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=beep.ctx||(beep.ctx=new AC());
  [880,1175,880].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.22;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.21)})}catch(e){}}
function alarm(c,p){const msg=c.wd>p.wd?'Nouvelle demande de retrait':c.dep>p.dep?'Nouveau dépôt MGA à valider':'Nouveau dépôt crypto déclaré';
  toast('🔔 '+msg);if(LS.get('epoketrby_sound')!=='0')beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
async function adminPoll(){
  if(!SESS||!S.me||!isAdmin()) return;
  try{const c=await adminCounts(),prev=S.admCnt;S.admCnt=c;
    document.title=(c.total?'('+c.total+') ':'')+"E-POKETR'BY";
    if(prev&&c.total>prev.total) alarm(c,prev);
    if(!prev||prev.total!==c.total){if(!busy())render(true)}
  }catch(e){}}

/* installation sur l'écran d'accueil (PWA) */
let INSTALL_EVT=null;
const isStandalone=()=>!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true);
if(window.addEventListener){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e});
  window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;toast('Application installée sur votre écran d\'accueil.')})}

/* démarrage */
async function boot(){
  applyTheme();render();
  if(SESS){
    try{await refresh();render();adminPoll();}
    catch(e){
      if(e.code==='net'){document.getElementById('app').innerHTML=headerBar(false)+`<main><div class="card" style="margin-top:20px"><b>Connexion impossible</b><div class="muted" style="margin-top:6px">Vérifiez votre internet puis rechargez la page.</div></div></main>`;}
      else{toast('⚠ '+friendlyErr(e));await doLogout(true)}}
  }
  loadMarket();
  setInterval(poll,20000);setInterval(loadMarket,300000);setInterval(autoSync,60000);setInterval(adminPoll,15000);setTimeout(adminPoll,3000);
  setTimeout(autoSync,4000)}
boot();

/* ---------- mises à jour instantanées (site en ligne uniquement) ----------
   À chaque déploiement, un petit fichier version.json change. L'application le consulte régulièrement :
   dès qu'une nouvelle version existe, elle se recharge toute seule quand l'utilisateur revient sur l'app,
   ou affiche le bandeau « Mettre à jour ». Aucun nouveau lien à envoyer : l'adresse du site ne change jamais. */
const APP_BUILD='2026-11-08-2';
if(location.protocol==='http:'||location.protocol==='https:'){
  let newer=false;
  const showUpd=()=>{const b=document.getElementById('upd');if(b)b.style.display='block'};
  async function checkVersion(){
    try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
      if(j&&j.build&&j.build!==APP_BUILD){newer=true;showUpd()}}catch(e){}}
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    checkVersion().then(()=>{ if(newer&&!sheetOpen()&&!ui.lock){const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,select,textarea')))location.reload()} })});
  setInterval(checkVersion,60000);setTimeout(checkVersion,5000);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
